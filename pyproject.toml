[project]
name = "zero-label"
version = "0.2.0"
description = "Train a custom image classifier from search terms — no dataset, no labelling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Oney Erge", email = "48371335+oney-erge@users.noreply.github.com" }]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "gradio>=4.0",
]

[project.urls]
Homepage = "https://github.com/oney-erge/image-classifier-web-search"
Repository = "https://github.com/oney-erge/image-classifier-web-search"
Issues = "https://github.com/oney-erge/image-classifier-web-search/issues"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.16",
]

[project.scripts]
autovision = "cli:app"

[tool.setuptools.packages.find]
include = ["autovision*"]

[tool.setuptools]
py-modules = ["cli", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
