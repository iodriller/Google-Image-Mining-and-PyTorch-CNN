[project]
name = "autovision"
version = "0.2.0"
description = "Zero-dataset image classifier — scrape images from the web, train a custom classifier"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "duckduckgo-search>=6.0",
    "httpx>=0.27",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "gradio>=4.0",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]

[project.scripts]
autovision = "cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
